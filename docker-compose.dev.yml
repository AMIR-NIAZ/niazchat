name: niazchat-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: niazchat-app:dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      TYPE_DB: ${TYPE_DB:-postgres}
      HOST_DB: postgres
      PORT_DB: 5432
      USERNAME_DB: ${USERNAME_DB:-postgres}
      PASSWORD_DB: ${PASSWORD_DB:-postgres}
      DATABASE_DB: ${DATABASE_DB:-niazchat}
      AUTOLOADENTITIES: "true"
      SYNCHRONIZE: ${SYNCHRONIZE:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_FILE_SIZE:-10485760}
      UPLOAD_ALLOWED_EXTENSIONS: ${UPLOAD_ALLOWED_EXTENSIONS:-jpg,jpeg,png,gif,webp,pdf,mp4,mp3,txt}
      STORAGE_DIR: ${STORAGE_DIR:-./storage}
    # Seeds once per container start (not on every hot reload), then starts watch mode.
    # Disable with RUN_SEED=false in .env.
    command:
      - sh
      - -c
      - |
        if [ "$${RUN_SEED:-true}" = "true" ]; then
          npm run seed:run-all || echo "seed failed, continuing..."
        fi
        exec npx nest start --watch --debug 0.0.0.0:9229
    ports:
      - "${APP_PORT:-3000}:3000"
      - "127.0.0.1:9229:9229" # Node inspector (debugger), not the app port
    volumes:
      # Live source code: any change on the host triggers `nest start --watch`.
      - ./:/app
      # Keep container's node_modules (don't let the host folder hide it).
      - node_modules_dev:/app/node_modules
      # Persist uploads/attachments across recreations.
      - uploads_data:/app/uploads
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${USERNAME_DB:-postgres}
      POSTGRES_PASSWORD: ${PASSWORD_DB:-postgres}
      POSTGRES_DB: ${DATABASE_DB:-niazchat}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432" # for DB GUI tools
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG;
          else
            redis-cli ping | grep -q PONG;
          fi
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  node_modules_dev:
  postgres_data:
  redis_data:
  uploads_data:
  storage_data: