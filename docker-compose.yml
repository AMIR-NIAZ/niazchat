name: niazchat

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PORT: 3000
    image: niazchat-app:latest
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # The container always serves on 3000; APP_PORT only changes the host port.
      PORT: 3000
      # Force service-name hosts inside the compose network (never localhost).
      TYPE_DB: ${TYPE_DB:-postgres}
      HOST_DB: postgres
      PORT_DB: 5432
      USERNAME_DB: ${USERNAME_DB:-postgres}
      PASSWORD_DB: ${PASSWORD_DB:-postgres}
      DATABASE_DB: ${DATABASE_DB:-niazchat}
      AUTOLOADENTITIES: "true"
      SYNCHRONIZE: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Persist user uploads (avatars, message files) across recreations.
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${USERNAME_DB:-postgres}
      POSTGRES_PASSWORD: ${PASSWORD_DB:-postgres}
      POSTGRES_DB: ${DATABASE_DB:-niazchat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG;
          else
            redis-cli ping | grep -q PONG;
          fi
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
